rubric_metadata:
  name: Rubric for c-bad-4.jpg
  version: 1.0.0
  issuer: sherifhanna
  date: "2026-04-25"
expressions:
  _validationResults: "(manifests[0].validationResults || { failure: [] })"

---
- id: test:c-bad-4:expected_failures
  description: Check if c-bad-4.jpg produces assertion hash mismatch and hard bindings missing errors
  expression: |
    length(_validationResults().failure[?contains(["assertion.hashedURI.mismatch", "claim.hardBindings.missing"], code)]) >= 2
  reportText:
    'true':
      en: "c-bad-4.jpg correctly failed with expected assertion and claim errors"
    'false':
      en: "Missing expected failures"

- id: test:c-bad-4:no_other_failures
  description: Check if there are no other failures
  expression: |
    length(_validationResults().failure[?!contains(["assertion.hashedURI.mismatch", "claim.hardBindings.missing"], code)]) == 0
  reportText:
    'true':
      en: "No other failures found as expected"
    'false':
      en: "Found unexpected failures"

- id: test:c-bad-4:expected_successes
  description: Check if all expected successes are present
  expression: |
    length(_validationResults().success[?contains(["timeStamp.validated", "timeStamp.trusted", "signingCredential.trusted", "claimSignature.insideValidity", "claimSignature.validated"], code)]) >= 5
  reportText:
    'true':
      en: "All expected successes are present"
    'false':
      en: "Missing some expected successes"
