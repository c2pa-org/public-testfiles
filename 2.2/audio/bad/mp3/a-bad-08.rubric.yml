rubric_metadata:
  name: Rubric for a-bad-08.mp3
  version: 1.0.0
  issuer: "Google LLC"
  date: "2026-04-25"
expressions:
  _validationResults: "(manifests[0].validationResults || { failure: [] })"

---
- id: test:a-bad-08:expected_failure
  description: Check if a-bad-08.mp3 produces assertion missing failure
  expression: |
    length(_validationResults().failure[?code == "assertion.missing"]) > 0
  reportText:
    'true':
      en: "a-bad-08.mp3 correctly failed with assertion missing"
    'false':
      en: "Missing expected assertion missing failure"

- id: test:a-bad-08:assertion_undeclared
  description: Check if a-bad-08.mp3 produces assertion undeclared failure
  expression: |
    length(_validationResults().failure[?code == "assertion.undeclared"]) > 0
  reportText:
    'true':
      en: "a-bad-08.mp3 correctly failed with assertion undeclared"
    'false':
      en: "Missing expected assertion undeclared failure"
