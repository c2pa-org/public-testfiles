rubric_metadata:
  name: Rubric for a-bad-1.mp3
  version: 1.0.0
  issuer: sherifhanna
  date: "2026-04-25"
expressions:
  _validationResults: "(manifests[0].validationResults || { failure: [] })"

---
- id: test:a-bad-1:expected_failure
  description: Check if a-bad-1.mp3 produces data hash mismatch
  expression: |
    length(_validationResults().failure[?code == "assertion.dataHash.mismatch"]) > 0
  reportText:
    'true':
      en: "a-bad-1.mp3 correctly failed with data hash mismatch"
    'false':
      en: "a-bad-1.mp3 failed to produce data hash mismatch"

- id: test:a-bad-1:no_other_failures
  description: Check if there are no other failures
  expression: |
    length(_validationResults().failure[?code != "assertion.dataHash.mismatch"]) == 0
  reportText:
    'true':
      en: "No other failures found as expected"
    'false':
      en: "Found unexpected failures"

- id: test:a-bad-1:expected_successes
  description: Check if all expected successes are present
  expression: |
    length(_validationResults().success[?contains(["timeStamp.validated", "timeStamp.trusted", "signingCredential.trusted", "claimSignature.insideValidity", "claimSignature.validated", "assertion.hashedURI.match"], code)]) >= 6
  reportText:
    'true':
      en: "All expected successes are present"
    'false':
      en: "Missing some expected successes"
