rubric_metadata:
  name: Rubric for a-bad-010.mp3
  version: 1.0.0
  issuer: "Google LLC"
  date: "2026-04-25"
expressions:
  _validationResults: "(manifests[0].validationResults || { failure: [] })"

---
- id: test:a-bad-010:expected_failures
  description: Check if a-bad-010.mp3 produces assertion missing and hard bindings missing errors
  expression: |
    length(_validationResults().failure[?contains(["assertion.missing", "claim.hardBindings.missing"], code)]) >= 2
  reportText:
    'true':
      en: "a-bad-010.mp3 correctly failed with expected assertion and claim errors"
    'false':
      en: "Missing expected failures"

- id: test:a-bad-010:no_other_failures
  description: Check if there are no other failures
  expression: |
    length(_validationResults().failure[?!contains(["assertion.missing", "claim.hardBindings.missing"], code)]) == 0
  reportText:
    'true':
      en: "No other failures found as expected"
    'false':
      en: "Found unexpected failures"

- id: test:a-bad-010:expected_successes
  description: Check if all expected successes are present
  expression: |
    length(_validationResults().success[?contains(["timeStamp.validated", "timeStamp.trusted", "signingCredential.trusted", "claimSignature.insideValidity", "claimSignature.validated"], code)]) >= 5
  reportText:
    'true':
      en: "All expected successes are present"
    'false':
      en: "Missing some expected successes"
