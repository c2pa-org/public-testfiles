rubric_metadata:
  name: Rubric for a-bad-5.m4a
  version: 1.0.0
  issuer: sherifhanna
  date: "2026-04-25"
expressions:
  _validationResults: "(manifests[0].validationResults || { failure: [] })"

---
- id: test:a-bad-5:expected_failures
  description: Check if a-bad-5.m4a produces claim missing and related errors
  expression: |
    length(_validationResults().failure[?contains(["claim.missing", "claim.cbor.invalid", "claimSignature.missing"], code)]) >= 3
  reportText:
    'true':
      en: "a-bad-5.m4a correctly failed with claim missing errors"
    'false':
      en: "Missing expected failures"

- id: test:a-bad-5:no_other_failures
  description: Check if there are no other failures
  expression: |
    length(_validationResults().failure[?!contains(["claim.missing", "claim.cbor.invalid", "claimSignature.missing"], code)]) == 0
  reportText:
    'true':
      en: "No other failures found as expected"
    'false':
      en: "Found unexpected failures"

- id: test:a-bad-5:expected_successes
  description: Check if all expected successes are present
  expression: |
    length(_validationResults().success) == 0
  reportText:
    'true':
      en: "Zero successes as expected"
    'false':
      en: "Found unexpected successes"
