rubric_metadata:
  name: Rubric for a-bad-21.m4a
  version: 1.0.0
  issuer: sherifhanna
  date: "2026-04-25"
expressions:
  _ingredientValidationResults: "(ingredient_manifests[0].validationResults || { failure: [] })"

---
- id: test:a-bad-21:expected_failure
  description: Check if a-bad-21.m4a produces assertion hash mismatch failure in ingredient manifest
  expression: |
    length(_ingredientValidationResults().failure[?code == "assertion.hashedURI.mismatch"]) > 0
  reportText:
    'true':
      en: "a-bad-21.m4a correctly failed with assertion hash mismatch error in ingredient"
    'false':
      en: "Missing expected failure in ingredient"

- id: test:a-bad-21:no_failures_active
  description: Check if there are no failures in the active manifest
  expression: |
    length((manifests[0].validationResults || { failure: [] }).failure) == 0
  reportText:
    'true':
      en: "No failures in active manifest as expected"
    'false':
      en: "Found unexpected failures in active manifest"
