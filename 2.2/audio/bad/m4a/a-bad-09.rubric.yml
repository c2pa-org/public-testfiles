rubric_metadata:
  name: Rubric for a-bad-09.m4a
  version: 1.0.0
  issuer: sherifhanna
  date: "2026-04-25"
expressions:
  _validationResults: "(manifests[0].validationResults || { informational: [] })"

---
- id: test:a-bad-09:expected_informational
  description: Check if a-bad-09.m4a produces untrusted timestamp informational error
  expression: |
    length(_validationResults().informational[?code == "timeStamp.untrusted"]) > 0
  reportText:
    'true':
      en: "a-bad-09.m4a correctly produced untrusted timestamp informational error"
    'false':
      en: "Missing expected informational error"

- id: test:a-bad-09:no_failures
  description: Check if there are no failures
  expression: |
    length(_validationResults().failure) == 0
  reportText:
    'true':
      en: "No failures found as expected"
    'false':
      en: "Found unexpected failures"

- id: test:a-bad-09:expected_successes
  description: Check if all expected successes are present
  expression: |
    length(_validationResults().success[?contains(["signingCredential.trusted", "claimSignature.insideValidity", "claimSignature.validated"], code)]) == 3
  reportText:
    'true':
      en: "All expected successes are present"
    'false':
      en: "Missing some expected successes"
