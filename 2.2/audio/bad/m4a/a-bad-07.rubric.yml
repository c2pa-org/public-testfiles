rubric_metadata:
  name: Rubric for a-bad-07.m4a
  version: 1.0.0
  issuer: "Google LLC"
  date: "2026-04-25"
expressions:
  _validationResults: "(manifests[0].validationResults || { failure: [] })"

---
- id: test:a-bad-07:expected_failures
  description: Check if a-bad-07.m4a produces claim invalid CBOR and signature mismatch errors
  expression: |
    length(_validationResults().failure[?contains(["claim.cbor.invalid", "claimSignature.mismatch"], code)]) >= 2
  reportText:
    'true':
      en: "a-bad-07.m4a correctly failed with claim invalid CBOR and signature mismatch errors"
    'false':
      en: "Missing expected failures"

- id: test:a-bad-07:no_other_failures
  description: Check if there are no other failures
  expression: |
    length(_validationResults().failure[?!contains(["claim.cbor.invalid", "claimSignature.mismatch"], code)]) == 0
  reportText:
    'true':
      en: "No other failures found as expected"
    'false':
      en: "Found unexpected failures"

- id: test:a-bad-07:expected_successes
  description: Check if all expected successes are present
  expression: |
    length(_validationResults().success[?contains(["timeStamp.validated", "timeStamp.trusted", "signingCredential.trusted", "claimSignature.insideValidity"], code)]) == 4
  reportText:
    'true':
      en: "All expected successes are present"
    'false':
      en: "Missing some expected successes"
