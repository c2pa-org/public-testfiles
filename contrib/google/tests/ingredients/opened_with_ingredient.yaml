description: JPEG with valid C2PA manifest, carrying a c2pa.opened action and one
  ingredient
inputs:
  assetPath: assets/opened_with_ingredient.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    isEmpty: {}
  successes:
    containsAllOf:
      codes:
      - signingCredential.trusted
      - claimSignature.insideValidity
      - claimSignature.validated
- failures:
    isEmpty: {}
  successes:
    containsAllOf:
      codes:
      - signingCredential.trusted
      - claimSignature.insideValidity
      - claimSignature.validated
