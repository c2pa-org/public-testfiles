description: MP4 with BMFF hash hard binding mismatch
inputs:
  assetPath: assets/bmff_hash_mismatch.mp4
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - assertion.bmffHash.mismatch
  successes:
    containsNoneOf:
      codes:
      - assertion.bmffHash.match
