description: Multipart JPEG where there is a gap of 1 byte between parts two and three,
  causing a malformed multi-asset hash failure
inputs:
  assetPath: assets/multipart_gap.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - assertion.multiAssetHash.malformed
  successes:
    containsNoneOf:
      codes:
      - assertion.multiAssetHash.match
