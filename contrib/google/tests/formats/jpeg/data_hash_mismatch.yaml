description: JPEG with data hash hard binding mismatch
inputs:
  assetPath: assets/data_hash_mismatch.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - assertion.dataHash.mismatch
  successes:
    containsNoneOf:
      codes:
      - assertion.dataHash.match
