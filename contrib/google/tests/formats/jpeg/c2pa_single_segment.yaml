description: JPEG with valid C2PA manifest store in a single APP11 segment
inputs:
  assetPath: assets/test1.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    isEmpty: {}
  successes:
    containsExactly:
      codes:
      - signingCredential.trusted
      - claimSignature.insideValidity
      - claimSignature.validated
      - assertion.hashedURI.match
      - assertion.dataHash.match
