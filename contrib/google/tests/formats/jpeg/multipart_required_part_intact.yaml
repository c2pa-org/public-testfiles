description: Multipart JPEG with multi-asset hash where the second part is required,
  fully intact and valid
inputs:
  assetPath: assets/multipart_required_part_intact.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    isEmpty: {}
  successes:
    containsAllOf:
      codes:
      - assertion.dataHash.match
    containsNoneOf:
      codes:
      - assertion.multiAssetHash.match
