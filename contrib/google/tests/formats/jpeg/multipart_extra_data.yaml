description: Multipart JPEG with multi-asset hash where there is extra data at the
  end of the file
inputs:
  assetPath: assets/multipart_extra_data.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAnyOf:
    - codes:
      - assertion.multiAssetHash.malformed
      - assertion.multiAssetHash.mismatch
  successes:
    containsNoneOf:
      codes:
      - assertion.multiAssetHash.match
