description: Multipart JPEG with multi-asset hash where the required second part and
  optional third part are removed
inputs:
  assetPath: assets/multipart_required_part_removed.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - assertion.multiAssetHash.missingPart
  successes:
    containsNoneOf:
      codes:
      - assertion.multiAssetHash.match
