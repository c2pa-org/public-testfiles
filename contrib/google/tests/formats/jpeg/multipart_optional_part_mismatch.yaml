description: Multipart JPEG with multi-asset hash, where one optional part is removed
  and another has a hash mismatch
inputs:
  assetPath: assets/multipart_optional_part_mismatch.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - assertion.multiAssetHash.mismatch
  successes:
    containsNoneOf:
      codes:
      - assertion.multiAssetHash.match
      - assertion.multiAssetHash.missingPart
