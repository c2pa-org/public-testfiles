description: claim signature missing (signature box has label 'xxxx.signature' instead
  of 'c2pa.signature')
inputs:
  assetPath: assets/sig_missing.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - claimSignature.missing
    containsNoneOf:
      codes:
      - claimSignature.validated
