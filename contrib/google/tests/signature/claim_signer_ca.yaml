description: claim signer certificate has disallowed CA:true flag
inputs:
  assetPath: assets/claim_signer_ca.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - signingCredential.invalid
  successes:
    containsNoneOf:
      codes:
      - claimSignature.validated
