description: claim missing from manifest store (claim.missing)
inputs:
  assetPath: assets/claim_missing.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - claim.missing
  successes:
    containsNoneOf:
      codes:
      - claimSignature.validated
      - signingCredential.trusted
