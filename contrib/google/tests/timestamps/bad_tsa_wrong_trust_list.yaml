description: TSA cert issuing CA on claim signing trust list but not TSA trust list
inputs:
  assetPath: assets/ts_2011_tsa_from_root1.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/tsa_ca_2000_2019.pem
  validationTime: "2015-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - claimSignature.outsideValidity
  informationals:
    containsAllOf:
      codes:
      - timeStamp.untrusted
  successes:
    containsNoneOf:
      codes:
      - claimSignature.validated
