description: issuing intermediate CA on trust list
inputs:
  assetPath: assets/issuing_ca_cert_omitted.jpg
  claimSignerTrustListPaths:
  - certs/sub_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    isEmpty: {}
  successes:
    containsAllOf:
      codes:
      - claimSignature.validated
      - signingCredential.trusted
