description: issuing intermediate CA cert missing from chain
inputs:
  assetPath: assets/issuing_ca_cert_omitted.jpg
  claimSignerTrustListPaths:
  - certs/root_ca1_cert.pem
  tsaTrustListPaths:
  - certs/root_ca1_cert.pem
  validationTime: "2001-06-01T00:00:00Z"
manifests:
- failures:
    containsAllOf:
      codes:
      - signingCredential.untrusted
  successes:
    containsNoneOf:
      codes:
      - signingCredential.trusted
